name: Docs Sync 151

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/docs-sync-151.yml'
      - 'LLM-proto/scripts/sync-docs-151.mjs'

permissions:
  contents: write

jobs:
  sync-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply README / PLAN sync
        run: node LLM-proto/scripts/sync-docs-151.mjs

      - name: Validate generated diff
        run: |
          git diff --check
          git diff -- LLM-proto/README.md LLM-proto/PLAN.md

      - name: Commit generated docs
        run: |
          if git diff --quiet -- LLM-proto/README.md LLM-proto/PLAN.md; then
            echo 'No docs changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add LLM-proto/README.md LLM-proto/PLAN.md
          git commit -m 'docs(llm-proto): sync provider canary and terminal rollout'
          git push origin HEAD:${{ github.head_ref }}
