name: Docs 151 alignment

on:
  push:
    branches:
      - 'agent/docs-151-provider-rollout-alignment'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/docs-151-provider-rollout-alignment
          fetch-depth: 0
      - name: Apply deterministic README and PLAN alignment
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          readme_path = Path('LLM-proto/README.md')
          plan_path = Path('LLM-proto/PLAN.md')
          readme = readme_path.read_text()
          plan = plan_path.read_text()

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              return text.replace(old, new, 1)

          deployment_row = "| Tax production exception archive DR provider continuous assurance production deployment canary | `src/workers-coordinator-publisher-tax-production-exception-archive-dr-provider-continuous-assurance-production-deployment-canary.ts` / `worker-runtime/continuous-assurance-production-canary-worker.mjs` / `scripts/deploy-continuous-assurance-production-canary.mjs` | deployed Worker version/config identity、read-only runtime→DO→engine wiring、R2 artifact、independent verification、redacted deploy planを検証 (#145) |"
          provider_row = "| Tax production exception archive DR provider continuous assurance production provider canary | `src/workers-coordinator-publisher-tax-production-exception-archive-dr-provider-continuous-assurance-production-provider-canary.ts` / `src/workers-coordinator-publisher-tax-production-exception-archive-dr-provider-continuous-assurance-production-provider-canary-controller-service.ts` | two-person authorization下でhealth/audit/primary+backup archive retrieval/pager dedupeのみを許可し、R2 artifact + independent verifierでproduction-candidate evidenceを検証 (#149) |"
          rollout_row = "| Tax production exception archive DR provider continuous assurance production operations rollout | `src/workers-coordinator-publisher-tax-production-exception-archive-dr-provider-continuous-assurance-production-operations-rollout.ts` | observe-only→maintenance→DR exercise→steady-stateの4 phaseをproduction-approved evidenceで検証し、clean時は`steady-state-enabled` + `bottlenecksToIssue: []`でvalidator chainを終了 (#152) |"
          terminal_note = "> #152 terminal rolloutのclean completion後は新しいvalidator gateを連鎖させず、次cycle・key rotation・DR exercise・retention・on-call/escalation・rollback/emergency controlsを`operationalObligations`として継続運用へ引き渡します。"
          readme = replace_once(readme, deployment_row, "\n".join([deployment_row, provider_row, rollout_row, "", terminal_note]), 'README module table')

          deploy_doc = "- [`docs/publisher-tax-production-exception-archive-dr-provider-continuous-assurance-production-deployment-canary.md`](./docs/publisher-tax-production-exception-archive-dr-provider-continuous-assurance-production-deployment-canary.md)"
          provider_doc = "- [`docs/publisher-tax-production-exception-archive-dr-provider-continuous-assurance-production-provider-canary.md`](./docs/publisher-tax-production-exception-archive-dr-provider-continuous-assurance-production-provider-canary.md)"
          rollout_doc = "- [`docs/publisher-tax-production-exception-archive-dr-provider-continuous-assurance-production-operations-rollout.md`](./docs/publisher-tax-production-exception-archive-dr-provider-continuous-assurance-production-operations-rollout.md)"
          readme = replace_once(readme, deploy_doc, "\n".join([deploy_doc, provider_doc, rollout_doc]), 'README docs list')

          deploy_cmd = "npm run test:workers-publisher-tax-production-exception-archive-dr-provider-continuous-assurance-production-deployment-canary"
          provider_cmd = "npm run test:workers-publisher-tax-production-exception-archive-dr-provider-continuous-assurance-production-provider-canary"
          rollout_cmd = "npm run test:workers-publisher-tax-production-exception-archive-dr-provider-continuous-assurance-production-operations-rollout"
          readme = replace_once(readme, deploy_cmd, "\n".join([deploy_cmd, provider_cmd, rollout_cmd]), 'README focused commands')

          issue_marker = "## 7. 現在の重要な修正課題\n\n"
          issue_152 = "- [#152](https://github.com/azumag/unzen/issues/152): production operations rollout terminal gate — exact #149 provider-canary evidenceからobserve-only / maintenance-enabled / dr-exercise-enabled / steady-state-enabledを順序固定で検証し、phase action allowlist、SLO/error budget、incident/control、rotation、backup-source DRをfail-close。clean時は`steady-state-enabled` + `bottlenecksToIssue: []`で継続運用obligationへ移行"
          issue_149 = "- [#149](https://github.com/azumag/unzen/issues/149): production provider canary — exact #145 deployment evidenceとtwo-person authorizationを必須に、provider health/audit、primary/backup archive retrieval、pager dedupeだけをbounded実行し、R2 artifact + dedicated independent verifierで`captured-and-verified` / `production-candidate`を検証。key rotation/DR/archive mutationはこの経路から禁止"
          readme = replace_once(readme, issue_marker, issue_marker + issue_152 + "\n" + issue_149 + "\n", 'README issue section')

          related_deploy = "| [`docs/publisher-tax-production-exception-archive-dr-provider-continuous-assurance-production-deployment-canary.md`](./docs/publisher-tax-production-exception-archive-dr-provider-continuous-assurance-production-deployment-canary.md) | deployed version/config identity、read-only runtime/engine wiring、R2 + independent verifier、redacted deployment helper、次bottleneck | #145 deployment-plan + read-only canary contract |"
          related_provider = "| [`docs/publisher-tax-production-exception-archive-dr-provider-continuous-assurance-production-provider-canary.md`](./docs/publisher-tax-production-exception-archive-dr-provider-continuous-assurance-production-provider-canary.md) | bounded operator-authorized provider health/audit/archive retrieval/pager dedupe、exact deployment binding、R2 + dedicated verifier | #149 production provider canary contract |"
          related_rollout = "| [`docs/publisher-tax-production-exception-archive-dr-provider-continuous-assurance-production-operations-rollout.md`](./docs/publisher-tax-production-exception-archive-dr-provider-continuous-assurance-production-operations-rollout.md) | four-phase terminal rollout、phase action allowlist、SLO/error budget、maintenance rotation、backup-source DR、steady-state obligations | #152 terminal rollout contract; clean時はnext validatorなし |"
          readme = replace_once(readme, related_deploy, "\n".join([related_deploy, related_provider, related_rollout]), 'README related docs')
          readme_path.write_text(readme)

          plan = replace_once(plan, '# unzen-LLM 計画書 v3.13', '# unzen-LLM 計画書 v3.15', 'PLAN title')
          lines = plan.splitlines()
          chrome_index = next((i for i, line in enumerate(lines) if line.startswith('42. ~~[Chrome Prompt API feasibility harness')), None)
          if chrome_index is None or chrome_index + 1 >= len(lines) or not lines[chrome_index + 1].startswith('43. [InferenceBackend / WorkerCapability'):
              raise SystemExit('PLAN steps 42/43 anchor not found')
          chrome = '44.' + lines[chrome_index][3:]
          inference = '45.' + lines[chrome_index + 1][3:]
          provider_step = "42. [Publisher tax filing production exception archive DR provider continuous assurance production provider canary (#149)](./docs/publisher-tax-production-exception-archive-dr-provider-continuous-assurance-production-provider-canary.md) で、exact #145 deployment-canary evidenceを再検証し、two-person・time-bounded authorizationの下でprovider health/audit read、primary/backup archive retrieval、pager canary + duplicate suppressionだけを許可する。provider/account/storage/archive/deployment identity、canonical digest、idempotency、R2 artifact + dedicated independent verifierを照合し、key rotation/DR/failover/archive mutationをこのcanary経路から禁止する。CI fixture passを実provider canaryとは扱わず、次の`publisher-tax-filing-production-exception-archive-dr-provider-continuous-assurance-production-operations-rollout`へ進む"
          rollout_step = "43. [Publisher tax filing production exception archive DR provider continuous assurance production operations rollout terminal gate (#152)](./docs/publisher-tax-production-exception-archive-dr-provider-continuous-assurance-production-operations-rollout.md) で、genuine #149 provider-canary evidenceを起点に`observe-only`→`maintenance-enabled`→`dr-exercise-enabled`→`steady-state-enabled`の4 phaseを順序固定・非重複windowで検証する。各phaseは`captured-and-verified` / `production-approved` evidence、phase-specific action allowlist、SLO/error budget、alert/incident/control、exact identityを必須とし、maintenance rotationは別authorization、DRはbackup storageとcanonical digestを必須化する。clean completionは`steady-state-enabled`、`bottlenecksToIssue: []`、next cycle/rotation/DR/retention/on-call/escalation/rollback/emergencyの`operationalObligations`を返してvalidator chainを終了し、以後は継続運用へ移行する"
          lines[chrome_index:chrome_index + 2] = [provider_step, rollout_step, chrome, inference]
          plan = '\n'.join(lines) + ('\n' if plan.endswith('\n') else '')
          plan = replace_once(plan, '**ドキュメントバージョン**: 3.13', '**ドキュメントバージョン**: 3.15', 'PLAN footer version')
          history = '**変更履歴**:\n'
          v315 = "- v3.15: #152 production operations rollout terminal gateを7.1項へ追加。observe-only→maintenance-enabled→dr-exercise-enabled→steady-state-enabledの4 phase、phase-specific action allowlist、production-approved evidence、SLO/error budget、maintenance rotation、backup-source DRを検証し、clean時は`steady-state-enabled` + `bottlenecksToIssue: []`と継続運用obligationを返してvalidator chainを終了"
          v314 = "- v3.14: #149 production provider canaryを7.1項へ追加。exact #145 deployment evidence、two-person/time-bounded authorization、health/audit/primary+backup retrieval/pager dedupeのbounded action set、R2 artifact + dedicated verifierを検証し、rotation/DR/archive mutationをcanary経路から禁止した上でterminal production operations rolloutを次段に明示"
          plan = replace_once(plan, history, history + v315 + '\n' + v314 + '\n', 'PLAN changelog')
          plan_path.write_text(plan)
          PY
          git diff --check
          git diff -- LLM-proto/README.md LLM-proto/PLAN.md
      - name: Commit documentation alignment
        shell: bash
        run: |
          if git diff --quiet -- LLM-proto/README.md LLM-proto/PLAN.md; then
            echo 'No docs changes to commit'
            exit 0
          fi
          git config user.name 'unzen-docs-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add LLM-proto/README.md LLM-proto/PLAN.md
          git commit -m 'docs(llm-proto): align provider canary and terminal rollout'
          git push origin HEAD:agent/docs-151-provider-rollout-alignment
