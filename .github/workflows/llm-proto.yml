name: LLM Proto

on:
  pull_request:
    paths:
      - '.github/workflows/llm-proto.yml'
      - 'LLM-proto/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/llm-proto.yml'
      - 'LLM-proto/**'
  workflow_dispatch:

jobs:
  durable-coordinator:
    name: Durable Coordinator
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: LLM-proto

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: LLM-proto/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Durable storage tests
        run: npm run test:durable-storage
