name: LLM Proto

on:
  pull_request:
    paths:
      - '.github/workflows/llm-proto.yml'
      - 'LLM-proto/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/llm-proto.yml'
      - 'LLM-proto/**'
  workflow_dispatch:

# Only a newer head of the same PR supersedes work. Non-PR runs get unique groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  llm-proto:
    name: LLM Proto
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: LLM-proto

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: LLM-proto/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: LLM-proto/tools/requirements-real-split.txt

      - name: Install dependencies
        run: npm ci

      - name: Install real split ONNX test dependencies
        run: python -m pip install -r tools/requirements-real-split.txt

      - name: Type check
        run: npx tsc --noEmit

      - name: Syntax check real browser harness
        run: |
          node --check browser-harness/webgpu-2b-split/serve.mjs
          node --check browser-harness/webgpu-2b-split/artifact-cache.js
          node --check browser-harness/webgpu-2b-split/p0-manifest-contract.js
          node --check browser-harness/webgpu-2b-split/runner-v3.js
          node --check browser-harness/endpoint-tile-webgpu/serve.mjs
          node --check browser-harness/endpoint-tile-webgpu/contract.js
          node --check browser-harness/endpoint-tile-webgpu/runner.js
          node --check browser-harness/endpoint-five-way-tile-webgpu/serve.mjs
          node --check browser-harness/endpoint-five-way-tile-webgpu/contract.js
          node --check browser-harness/endpoint-five-way-tile-webgpu/runner.js
          node --check browser-harness/endpoint-poststage-tiled-webgpu/serve.mjs
          node --check browser-harness/endpoint-poststage-tiled-webgpu/contract.js
          node --check browser-harness/endpoint-poststage-tiled-webgpu/runner.js
          node --check browser-harness/endpoint-embedding-tiled-webgpu/serve.mjs
          node --check browser-harness/endpoint-embedding-tiled-webgpu/contract.js
          node --check browser-harness/endpoint-embedding-tiled-webgpu/runner.js
          node --check browser-harness/endpoint-embedding-eight-physical-webgpu/serve.mjs
          node --check browser-harness/endpoint-embedding-eight-physical-webgpu/contract.js
          node --check browser-harness/endpoint-embedding-eight-physical-webgpu/comparison.js
          node --check browser-harness/endpoint-embedding-eight-physical-webgpu/runner.js
          node --check tools/preflight_endpoint_embedding_eight_physical_bundle.mjs
          node --check tools/capture_endpoint_embedding_eight_physical_webgpu_process_rss.mjs
          node --check tools/verify_endpoint_embedding_eight_physical_webgpu_process_rss.mjs
          node --check tools/capture_endpoint_embedding_eight_physical_webgpu_cancel_rss.mjs
          node --check tools/verify_endpoint_embedding_eight_physical_webgpu_cancel_rss.mjs
          node --check tools/capture_endpoint_poststage_webgpu_process_rss.mjs
          node --check tools/check_wrangler_wasm_packaging.mjs
          node --check worker-runtime/wasm-canary-worker.mjs
          node --check tools/wasm_canary_contract.mjs
          node --check tools/wasm_canary_deploy_gate.mjs
          node --check tools/check_wrangler_wasm_canary.mjs
          node --check tools/check_wasm_canary_remote.mjs

      - name: Verify Wrangler Wasm dry-run packaging
        run: npm run verify:wrangler-wasm-packaging

      - name: Verify isolated Wasm canary dry-run package
        run: node tools/check_wrangler_wasm_canary.mjs

      - name: Verify Wasm canary deploy gate defaults to non-execution
        run: node tools/wasm_canary_deploy_gate.mjs deploy

      - name: Probe pinned SmolLM2 P0 graph contract
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/smollm2-135m-model_q4.onnx \
            'https://huggingface.co/onnx-community/SmolLM2-135M-ONNX/resolve/0d747f789bcf79b9b57a4be7f3277b64c185f8ef/onnx/model_q4.onnx?download=true'
          echo 'da1d291b342acafd806b284052053902af82c52121c400789bdf8ab1effdb4c8  /tmp/smollm2-135m-model_q4.onnx' | sha256sum -c -
          python tools/probe_p0_smollm2_graph.py /tmp/smollm2-135m-model_q4.onnx

      - name: Probe pinned Llama 1B browser-budget blocker
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/llama-3.2-1b-model_q4.onnx \
            'https://huggingface.co/onnx-community/Llama-3.2-1B-Instruct/resolve/14007543b6dc92de88daf96a9aa85d2f95ace6ef/onnx/model_q4.onnx?download=true'
          echo 'a3a6f10916f79379d15cfa9270b7be0d09be2b80fe0872bd7030eaf9001baf46  /tmp/llama-3.2-1b-model_q4.onnx' | sha256sum -c -
          python tools/probe_llama_1b_budget_blocker.py /tmp/llama-3.2-1b-model_q4.onnx
          python tools/probe_llama_1b_endpoint_chunk_envelope.py /tmp/llama-3.2-1b-model_q4.onnx
          python tools/probe_llama_1b_endpoint_layout_candidates.py /tmp/llama-3.2-1b-model_q4.onnx
          python tools/probe_llama_1b_endpoint_dependency_closure.py /tmp/llama-3.2-1b-model_q4.onnx
          python tools/probe_llama_1b_endpoint_p0_layout_comparison.py /tmp/llama-3.2-1b-model_q4.onnx

      - name: Test real ONNX split contract
        run: python -m unittest discover -s tools/tests -p 'test_*.py'

      - name: Test
        env:
          UNZEN_MINIFLARE_TIMING: '1'
        run: npm test
