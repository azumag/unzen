name: Docs Alignment 151

on:
  push:
    branches:
      - docs/issue-151-provider-rollout-alignment
    paths:
      - .github/workflows/docs-alignment-151.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/issue-151-provider-rollout-alignment
      - name: Align README and PLAN
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 anchor, found {count}')
              return text.replace(old, new, 1)

          readme_path = Path('LLM-proto/README.md')
          readme = readme_path.read_text()

          deployment_row = "| Tax production exception archive DR provider continuous assurance production deployment canary | `src/workers-coordinator-publisher-tax-production-exception-archive-dr-provider-continuous-assurance-production-deployment-canary.ts` / `worker-runtime/continuous-assurance-production-canary-worker.mjs` / `scripts/deploy-continuous-assurance-production-canary.mjs` | deployed Worker version/config identity、read-only runtime→DO→engine wiring、R2 artifact、independent verification、redacted deploy planを検証 (#145) |"
          provider_row = "| Tax production exception archive DR provider continuous assurance production provider canary | `src/workers-coordinator-publisher-tax-production-exception-archive-dr-provider-continuous-assurance-production-provider-canary.ts` / `worker-runtime/continuous-assurance-production-provider-canary-worker.mjs` | exact deployment evidence、two-person bounded authorization、health/audit/primary+backup retrieval、pager dedupe、R2 + dedicated independent verifierを検証 (#149) |"
          rollout_row = "| Tax production exception archive DR provider continuous assurance production operations rollout | `src/workers-coordinator-publisher-tax-production-exception-archive-dr-provider-continuous-assurance-production-operations-rollout.ts` | observe-only→maintenance→DR→steady-stateの4 phaseを独立verified evidenceで昇格し、clean時は`steady-state-enabled` + operational obligationsでvalidator chainを終了 (#152) |"
          readme = replace_once(readme, deployment_row, deployment_row + '\n' + provider_row + '\n' + rollout_row, 'README module rows')

          deployment_doc = "- [`docs/publisher-tax-production-exception-archive-dr-provider-continuous-assurance-production-deployment-canary.md`](./docs/publisher-tax-production-exception-archive-dr-provider-continuous-assurance-production-deployment-canary.md)"
          provider_doc = "- [`docs/publisher-tax-production-exception-archive-dr-provider-continuous-assurance-production-provider-canary.md`](./docs/publisher-tax-production-exception-archive-dr-provider-continuous-assurance-production-provider-canary.md)"
          rollout_doc = "- [`docs/publisher-tax-production-exception-archive-dr-provider-continuous-assurance-production-operations-rollout.md`](./docs/publisher-tax-production-exception-archive-dr-provider-continuous-assurance-production-operations-rollout.md)"
          readme = replace_once(readme, deployment_doc, deployment_doc + '\n' + provider_doc + '\n' + rollout_doc, 'README docs list')

          deployment_cmd = "npm run test:workers-publisher-tax-production-exception-archive-dr-provider-continuous-assurance-production-deployment-canary"
          provider_cmd = "npm run test:workers-publisher-tax-production-exception-archive-dr-provider-continuous-assurance-production-provider-canary"
          rollout_cmd = "npm run test:workers-publisher-tax-production-exception-archive-dr-provider-continuous-assurance-production-operations-rollout"
          readme = replace_once(readme, deployment_cmd, deployment_cmd + '\n' + provider_cmd + '\n' + rollout_cmd, 'README focused commands')

          issue145 = "- [#145](https://github.com/azumag/unzen/issues/145): production exception archive DR provider continuous assurance production deployment canary — Worker `version_metadata` / config fingerprint、read-only runtime→SQLite DO→engine経路、engine-observed adapter identity、R2 artifact + independent verifier、bad-secret/duplicate/digest/trust negative checks、secret-redacted deploy helperを検証。実Cloudflare/provider canaryをCIのpassとは扱わず、次の`publisher-tax-filing-production-exception-archive-dr-provider-continuous-assurance-production-provider-canary`をbottleneckとして明示"
          issue149 = "- [#149](https://github.com/azumag/unzen/issues/149): production provider canary — exact #145 deployment evidenceを独立再検証し、two-person / time-bounded authorization下でprovider health/audit、primary/backup archive retrieval、pager dedupeだけを許可。rotation/DR/archive mutationはdefault-denyし、R2 artifact + dedicated independent verifierで`production-candidate` evidence化。次のproduction operations rolloutへ進む"
          issue152 = "- [#152](https://github.com/azumag/unzen/issues/152): terminal production operations rollout — observe-only→maintenance-enabled→dr-exercise-enabled→steady-state-enabledを順序固定し、各phaseの`captured-and-verified` / `production-approved` evidence、action allowlist、SLO/error budget、incident/control、key rotation、backup-source DRを検証。clean時は`steady-state-enabled`、`bottlenecksToIssue: []`と継続運用obligationを返しvalidator chainを終了"
          readme = replace_once(readme, issue145, issue152 + '\n' + issue149 + '\n' + issue145, 'README issue rows')

          deployment_table = "| [`docs/publisher-tax-production-exception-archive-dr-provider-continuous-assurance-production-deployment-canary.md`](./docs/publisher-tax-production-exception-archive-dr-provider-continuous-assurance-production-deployment-canary.md) | deployed version/config identity、read-only runtime/engine wiring、R2 + independent verifier、redacted deployment helper、次bottleneck | #145 deployment-plan + read-only canary contract |"
          provider_table = "| [`docs/publisher-tax-production-exception-archive-dr-provider-continuous-assurance-production-provider-canary.md`](./docs/publisher-tax-production-exception-archive-dr-provider-continuous-assurance-production-provider-canary.md) | exact deployment binding、two-person bounded authorization、read-only provider/archive checks、pager dedupe、dedicated verifier、次bottleneck | #149 bounded production provider canary contract |"
          rollout_table = "| [`docs/publisher-tax-production-exception-archive-dr-provider-continuous-assurance-production-operations-rollout.md`](./docs/publisher-tax-production-exception-archive-dr-provider-continuous-assurance-production-operations-rollout.md) | 4-phase production rollout、phase action allowlist、SLO/error budget、maintenance rotation、backup-source DR、terminal operational obligations | #152 terminal rollout gate; clean時は次validatorなし |"
          readme = replace_once(readme, deployment_table, deployment_table + '\n' + provider_table + '\n' + rollout_table, 'README related docs')
          readme_path.write_text(readme)

          plan_path = Path('LLM-proto/PLAN.md')
          plan = plan_path.read_text()
          plan = replace_once(plan, '# unzen-LLM 計画書 v3.13', '# unzen-LLM 計画書 v3.15', 'PLAN title')

          step41 = "41. [Publisher tax filing production exception archive DR provider continuous assurance production deployment canary (#145)](./docs/publisher-tax-production-exception-archive-dr-provider-continuous-assurance-production-deployment-canary.md) で、Cloudflare Worker `version_metadata` とdeploy-time config fingerprintをcontroller/runtime/engine/provider/evidence/pager/verifierへ固定し、controller→runtime→同一SQLite DO `runScheduled()`→engine、engine-observed adapter Service Binding identity、R2 canary artifact、independent verifier、bad-secret/duplicate/digest/trust negative path、secret-redacted Wrangler deployment helperを検証する。このcanaryはnormal Cronと競合するprovider write/key rotation/DR exerciseを発行しないread-only `idle` tickに限定し、CI/Miniflare/dry-run passをactual Cloudflare deployment evidenceとは扱わない。次の`publisher-tax-filing-production-exception-archive-dr-provider-continuous-assurance-production-provider-canary`へ進む"
          step42 = "42. [Publisher tax filing production exception archive DR provider continuous assurance production provider canary (#149)](./docs/publisher-tax-production-exception-archive-dr-provider-continuous-assurance-production-provider-canary.md) で、#145のexact deployment evidenceを独立再検証し、two-person/time-bounded authorizationにprovider/account/storage/archive/deployment identityを固定する。health/audit、primary/backup archive retrieval、pager canary+dedupeだけを許可し、key rotation/DR/archive mutationはdefault-denyする。R2 canonical artifact + dedicated independent verifierで`captured-and-verified` / `production-candidate` evidence化し、fixture CIを実provider実行とは扱わず、次の`publisher-tax-filing-production-exception-archive-dr-provider-continuous-assurance-production-operations-rollout`へ進む"
          step43 = "43. [Publisher tax filing production exception archive DR provider continuous assurance production operations rollout (#152)](./docs/publisher-tax-production-exception-archive-dr-provider-continuous-assurance-production-operations-rollout.md) で、exact #149 provider-canary evidenceとrollout authorizationを再検証し、`observe-only`→`maintenance-enabled`→`dr-exercise-enabled`→`steady-state-enabled`の4 phaseを順序固定する。各phaseは独立`captured-and-verified` / `production-approved` evidence、phase-specific action allowlist、SLO/error budget、alert/incident/control、provider/archive/deployment identityを満たす必要がある。maintenance phaseのdue key rotationとDR phaseのbackup-source exerciseだけを別authorizationで許可する。clean completionはterminal `steady-state-enabled`、`bottlenecksToIssue: []`とnext cycle/rotation/DR/retention/on-call/rollback obligationsを返し、新しいvalidator gateは作らない"
          plan = replace_once(plan, step41, step41 + '\n' + step42 + '\n' + step43, 'PLAN rollout steps')
          plan = replace_once(plan, '42. ~~[Chrome Prompt API feasibility harness (#93)]', '44. ~~[Chrome Prompt API feasibility harness (#93)]', 'PLAN Chrome numbering')
          plan = replace_once(plan, '43. [InferenceBackend / WorkerCapability 抽象化 (#94)]', '45. [InferenceBackend / WorkerCapability 抽象化 (#94)]', 'PLAN inference numbering')
          plan = replace_once(plan, '**ドキュメントバージョン**: 3.13', '**ドキュメントバージョン**: 3.15', 'PLAN document version')
          history = "**変更履歴**:"
          history_new = "**変更履歴**:\n- v3.15: #152 terminal production operations rolloutを7.1項へ追加。observe-only→maintenance→DR→steady-stateの4 phase、独立verified phase evidence、phase action allowlist、SLO/error budget、incident/control、authorized key rotation、backup-source DR、terminal operational obligationsを検証し、clean時は`steady-state-enabled` + `bottlenecksToIssue: []`でvalidator chainを終了\n- v3.14: #149 production provider canaryを7.1項へ追加。exact #145 deployment evidence、two-person bounded authorization、provider health/audit、primary/backup archive retrieval、pager dedupe、R2 artifact + dedicated independent verifierを検証し、destructive provider operationsをdefault-denyした上でproduction operations rolloutへ進む"
          plan = replace_once(plan, history, history_new, 'PLAN changelog')
          plan_path.write_text(plan)
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LLM-proto/README.md LLM-proto/PLAN.md
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "docs(llm-proto): align provider canary and terminal rollout"
          git push
