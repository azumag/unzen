<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>WebGPU 2B harness</title>
  <style>
    body { font-family: -apple-system, sans-serif; margin: 1rem; }
    .banner { font-weight: 600; padding: .5rem; border-radius: 4px; background: #eee; }
    .banner.ok { background: #d4edda; }
    .banner.error { background: #f8d7da; }
    button { font-size: 1rem; padding: .4rem 1rem; }
    pre { background: #f6f8fa; padding: .5rem; overflow: auto; max-height: 24rem; }
    textarea { width: 100%; height: 20rem; font-family: monospace; font-size: .8rem; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>WebGPU 2B harness</h1>
  <div id="banner" class="banner">idle</div>
  <p><button id="run" disabled>Run</button></p>
  <pre id="log"></pre>
  <div id="report-holder" class="hidden">
    <h2>Report (self-reported)</h2>
    <textarea id="report-output"></textarea>
  </div>
  <script type="module" src="./runner.js"></script>
</body>
</html>
