<!doctype html>
<meta charset="utf-8">
<title>Unzen SmolLM2-135M P0 redirect</title>
<p>Preparing the browser-budgeted SmolLM2-135M WebGPU P0…</p>
<script>
  const params = new URLSearchParams(location.search);
  // These parameters define the P0 evidence contract and must not be relaxed by
  // query-string overrides. Operator-specific role/run/splitRoot remain configurable.
  params.set('model', 'onnx-community/SmolLM2-135M-ONNX');
  params.set('kvHeads', '3');
  params.set('headSize', '64');
  params.set('artifactBudget', 'p0');
  if (!params.has('role')) params.set('role', 'segment0');
  if (!params.has('run')) params.set('run', 'smollm2-p0');
  location.replace('/?' + params.toString());
</script>
